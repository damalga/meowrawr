# Meowrawr — security response headers.
#
# Include this file inside the `server { }` block that serves meowrawr.org.
# Example:
#     server {
#         listen 80;
#         server_name meowrawr.org;
#         root /var/www/meowrawr/dist;
#         include /etc/nginx/snippets/meowrawr-security.conf;
#         ...
#     }
#
# WARNING: In vanilla Nginx, if ANY `add_header` appears inside a nested
# `location` block, ALL `add_header` directives from the parent are dropped.
# If you use per-location headers, `include` this file again inside every
# `location` block, or install nginx-module-headers-more and use
# `more_set_headers` instead of `add_header`.
#
# Traffic path: Browser -> Cloudflare Edge -> Cloudflare Tunnel -> Nginx.
# Cloudflare Tunnel passes response headers through unchanged unless a
# Transform Rule is defined at the edge. If Cloudflare adds HSTS on its own
# (Dashboard > SSL/TLS > Edge Certificates > HSTS), keep it disabled there
# or remove the HSTS line below to avoid duplicates.

# ---------------------------------------------------------------------------
# 1. Strict-Transport-Security (HSTS)
# Force HTTPS for 1 year on this host + subdomains. Add `preload` only after
# you have verified every subdomain works over HTTPS and you plan to submit
# the domain at https://hstspreload.org.
# ---------------------------------------------------------------------------
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ---------------------------------------------------------------------------
# 2. Content-Security-Policy (CSP)
# Whitelists what the browser may load. Blocks XSS and data exfiltration.
# Allows:
#   * scripts + XHR to https://stats.damalga.com (self-hosted Matomo)
#   * images from iNaturalist S3 + static.inaturalist.org
#   * inline nothing (Matomo has been moved to /assets/scripts/matomo.js)
# ---------------------------------------------------------------------------
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.damalga.com; style-src 'self'; img-src 'self' data: https://inaturalist-open-data.s3.amazonaws.com https://static.inaturalist.org; font-src 'self'; connect-src 'self' https://stats.damalga.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

# ---------------------------------------------------------------------------
# 3. X-Content-Type-Options
# Prevents MIME sniffing: the browser trusts the declared Content-Type.
# ---------------------------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;

# ---------------------------------------------------------------------------
# 4. Referrer-Policy
# Full URL for same-origin, only origin for cross-origin HTTPS, nothing on
# downgrade. Balances Matomo analytics vs. leaking user paths to third parties.
# ---------------------------------------------------------------------------
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ---------------------------------------------------------------------------
# 5. Permissions-Policy
# Disables every browser API the site does not use. Reduces the blast radius
# of any future XSS. Add `=(self)` if you ever need one of these back.
# ---------------------------------------------------------------------------
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()" always;

# ---------------------------------------------------------------------------
# 6. X-Frame-Options
# Legacy anti-clickjacking header. Modern browsers already covered by
# `frame-ancestors 'none'` in the CSP above; this line covers older ones.
# ---------------------------------------------------------------------------
add_header X-Frame-Options "DENY" always;

# ---------------------------------------------------------------------------
# 7. Cross-Origin-Opener-Policy
# Isolates the top-level window from other origins. Mitigates Spectre-class
# side-channels and abuse of window.opener.
# ---------------------------------------------------------------------------
add_header Cross-Origin-Opener-Policy "same-origin" always;

# ---------------------------------------------------------------------------
# NOT INCLUDED (deliberate)
# ---------------------------------------------------------------------------
# * X-XSS-Protection            — deprecated; modern browsers ignore or misbehave.
# * Expect-CT                   — deprecated; CT is now mandatory.
# * Feature-Policy              — superseded by Permissions-Policy (above).
# * Cross-Origin-Embedder-Policy — would break iNaturalist images (they do
#                                  not send Cross-Origin-Resource-Policy).
